spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/auth/**

            - id: user-service-users
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/users/**

            - id: restaurant-service
              uri: lb://RESTAURANT-SERVICE
              predicates:
                - Path=/api/restaurants/**

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/orders/**

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8571/eureka/

  instance:
    prefer-ip-address: true