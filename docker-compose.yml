# Food Delivery Microservices - Docker Compose
# Run from the project root: docker compose up -d --build

x-eureka-env: &eureka-env
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8571/eureka/

x-db-env: &db-env
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

x-jwt-env: &jwt-env
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}

x-jvm-env: &jvm-env
  JAVA_TOOL_OPTIONS: "-Xmx384m"

services:
  postgres:
    image: postgres:17
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: on-failure

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    restart: on-failure

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8571:8571"
    environment:
      <<: *jvm-env
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    restart: on-failure

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8087:8087"
    environment:
      <<: [*eureka-env, *db-env, *jwt-env, *jvm-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_service_db
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure

  restaurant-service:
    build: ./restaurant-service
    container_name: restaurant-service
    ports:
      - "8082:8082"
    environment:
      <<: [*eureka-env, *db-env, *jwt-env, *jvm-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/restaurant_service_db
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8085:8085"
    environment:
      <<: [*eureka-env, *db-env, *jwt-env, *jvm-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_service_db
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    restart: on-failure

  payment-service:
    build: ./payment-service
    container_name: payment-service
    ports:
      - "8084:8084"
    environment:
      <<: [*eureka-env, *db-env, *jwt-env, *jvm-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_service_db
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: on-failure

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8086:8086"
    environment:
      <<: [*eureka-env, *jvm-env]
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      eureka-server:
        condition: service_started
      kafka:
        condition: service_started
    restart: on-failure

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8090:8090"
    environment:
      <<: [*eureka-env, *jvm-env]
    depends_on:
      eureka-server:
        condition: service_started
    restart: on-failure

volumes:
  pgdata: